pre-push:
  parallel: true
  commands:
    # Build check to ensure project builds successfully
    build:
      glob: "*.{js,jsx,ts,tsx,astro,json,css}"
      run: vp pack

    # Audit
    audit:
      run: vp pm audit

    # Check for secret leaks
    leaks:
      run: gitleaks dir

commit-msg:
  commands:
    # Validate commit message format
    commitlint:
      run: committed --commit-file {1}
